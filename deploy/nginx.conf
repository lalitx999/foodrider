# nginx สำหรับ production — อยู่หลัง Caddy เสมอ (ไม่เปิดพอร์ตออกนอก docker)
# Caddy จบ HTTPS แล้วส่งต่อมาเป็น http จึงต้องส่งค่า X-Forwarded-Proto ที่ Caddy ตั้งไว้ต่อให้ Django
# (ถ้าส่ง $scheme = http ไป Django จะ redirect ไป https วนไม่จบ)
server {
    listen 80;
    server_name _;

    # สลิป ≤ 5MB + multipart overhead (P0-05)
    client_max_body_size 8M;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # รูปสาธารณะ (ต้องตรงกับ PUBLIC_MEDIA_PREFIXES ใน settings.py)
    location /media/merchant-menus/ {
        alias /app/media/merchant-menus/;
        expires 7d;
    }

    location /media/merchant-storefronts/ {
        alias /app/media/merchant-storefronts/;
        expires 7d;
    }

    location /media/merchant-applications/storefronts/ {
        alias /app/media/merchant-applications/storefronts/;
        expires 7d;
    }

    # P0-11: /media/ อื่นๆ เข้าได้เฉพาะผ่าน X-Accel-Redirect จาก Django
    location /media/ {
        internal;
        alias /app/media/;
    }

    # ไฟล์สลิป (private)
    location /private-media/ {
        internal;
        alias /app/private_media/;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 35s;
    }
}

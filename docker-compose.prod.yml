# Production บน VPS (Module 33 · S-5)
# รันจากโฟลเดอร์ที่ clone repo นี้มา:  docker compose -f docker-compose.prod.yml up -d --build
# ค่าทั้งหมดอ่านจากไฟล์ .env ข้างๆ ไฟล์นี้ (ดู .env.example และ deploy/README.md)
#
# ต่างจาก docker-compose.yml สำหรับเครื่อง dev:
# - db / redis / gunicorn ไม่เปิดพอร์ตออกนอกเครื่อง — เข้าได้แค่ในเครือข่าย docker
# - Caddy ถือพอร์ต 80/443 และขอใบรับรอง HTTPS ให้เองอัตโนมัติ
# - ไม่ mount โค้ดจากเครื่อง (ใช้โค้ดที่ build ไว้ใน image) — อัปเดตด้วย git pull + build ใหม่

x-app: &app
  build: .
  image: foodrider-backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    REDIS_CACHE_URL: redis://redis:6379/1
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in .env}
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    <<: *app
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout 30
      --access-logfile -
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - private_media_volume:/app/private_media

  celery_worker:
    <<: *app
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - media_volume:/app/media
      - private_media_volume:/app/private_media

  celery_beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - private_media_volume:/app/private_media:ro
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env e.g. api.yourshop.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  private_media_volume:
  caddy_data:
  caddy_config:

server {
    listen 80;
    server_name _;

    # สลิป ≤ 5MB + multipart overhead (P0-05)
    client_max_body_size 8M;

    location /static/ {
        alias /app/staticfiles/;
    }

    # รูปสาธารณะ (ต้องตรงกับ PUBLIC_MEDIA_PREFIXES ใน settings.py)
    # nginx เลือก location ที่ prefix ยาวที่สุด จึงชนะ /media/ ด้านล่าง
    location /media/merchant-menus/ {
        alias /app/media/merchant-menus/;
        expires 7d;
    }

    location /media/merchant-storefronts/ {
        alias /app/media/merchant-storefronts/;
        expires 7d;
    }

    location /media/merchant-applications/storefronts/ {
        alias /app/media/merchant-applications/storefronts/;
        expires 7d;
    }

    # P0-11: ห้ามเข้าถึง /media/ จากภายนอก — ให้ Django ใช้ X-Accel-Redirect มาที่ internal location
    location /media/ {
        internal;
        alias /app/media/;
    }

    # ไฟล์สลิป (private) — เข้าได้เฉพาะคำขอที่ Django แนบ X-Accel-Redirect มาภายในเท่านั้น
    location /private-media/ {
        internal;
        alias /app/private_media/;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
